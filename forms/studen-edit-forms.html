<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sgc</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../forms/forms-styles.css" />
</head>
<body>
    <div class="container-forms">
        <form class="form-student">
            <a href="../students.html" class="close">✕</a>
            <h2 class="title-form">Modificar estudiante</h2>

            <div class="form-group inputs">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required>

                <label for="last-name">Apellido</label>
                <input type="text" id="last-name" name="last-name" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Celular</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <div class="btns">
                <a href="../students.html" class="add-bith cancel">Cancelar</a>
                <button type="submit" class="add-bith">Guardar</button>
            </div>
        </form>
    </div>
</body>
</html>
