<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sgc</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../forms/forms-styles.css" />
</head>
<body>
    <div class="container-forms">
        <form class="form-student">
            <a href="../courses.html" class="close">✕</a>
            <h2 class="title-form">Modificar curso</h2>

            <div class="form-group inputs">
                <label for="code">Código</label>
                <input type="text" id="code" name="code" required>

                <label for="course-name">Nombre del curso</label>
                <input type="text" id="course-name" name="course-name" required>

                <label for="description">Descripción</label>
                <textarea id="description" name="description" rows="4"></textarea>

                <label for="capacity">Capacidad máxima</label>
                <input type="number" id="capacity" name="capacity" required>
            </div>

            <div class="btns">
                <a href="../courses.html" class="add-bith cancel">Cancelar</a>
                <button type="submit" class="add-bith">Guardar</button>
            </div>
        </form>
    </div>
</body>
</html>
